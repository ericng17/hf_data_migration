name: Hugging Face Dataset Migration

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Specific dataset (empty = all)"
        required: false
        default: ""

concurrency:
  group: hf-dataset-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUNBUFFERED: "1"
      MAX_RUNTIME: "19800"
      DATASET: ${{ inputs.dataset }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U huggingface_hub

      - name: Migrate datasets
        run: |
          if [ -n "$DATASET" ]; then
            python migrate_to_bucket.py --dataset "$DATASET"
          else
            python migrate_to_bucket.py
          fi